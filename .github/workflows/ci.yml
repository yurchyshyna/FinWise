name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (flake8 + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Отримати код
        uses: actions/checkout@v4

      - name: Встановити Python з кешем pip
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Встановити залежності
        run: pip install -r requirements-dev.txt

      - name: Лінтер flake8
        run: flake8 app tests

      - name: Модульні тести pytest
        run: python -m pytest

  frontend:
    name: Frontend (ESLint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Отримати код
        uses: actions/checkout@v4

      - name: Встановити Node.js з кешем npm
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Встановити залежності
        run: npm ci

      - name: Лінтер ESLint
        run: npm run lint

  dockerfiles:
    name: Dockerfiles (hadolint)
    runs-on: ubuntu-latest
    steps:
      - name: Отримати код
        uses: actions/checkout@v4

      - name: hadolint для backend
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile

      - name: hadolint для frontend
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile

    
  security:
    name: Security (Trivy)
    runs-on: ubuntu-latest
    needs: [backend, frontend, dockerfiles]
    steps:
      - name: Отримати код
        uses: actions/checkout@v4

      - name: Зібрати образ backend
        run: docker build -t finwise-api:scan ./backend

      - name: Зібрати образ frontend
        run: docker build -t finwise-web:scan ./frontend

      - name: Сканування образу backend (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: finwise-api:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Сканування образу frontend (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: finwise-web:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"      