name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (flake8 + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Отримати код
        uses: actions/checkout@v4

      - name: Встановити Python з кешем pip
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Встановити залежності
        run: pip install -r requirements-dev.txt

      - name: Лінтер flake8
        run: flake8 app tests

      - name: Модульні тести pytest
        run: python -m pytest

  frontend:
    name: Frontend (ESLint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Отримати код
        uses: actions/checkout@v4

      - name: Встановити Node.js з кешем npm
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Встановити залежності
        run: npm ci

      - name: Лінтер ESLint
        run: npm run lint

  dockerfiles:
    name: Dockerfiles (hadolint)
    runs-on: ubuntu-latest
    steps:
      - name: Отримати код
        uses: actions/checkout@v4

      - name: hadolint для backend
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: backend/Dockerfile

      - name: hadolint для frontend
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: frontend/Dockerfile

    
  images:
    name: Image (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [backend, frontend, dockerfiles]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            context: ./backend
          - image: web
            context: ./frontend
    env:
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/finwise-${{ matrix.image }}
    steps:
      - name: Отримати код
        uses: actions/checkout@v4

      - name: Налаштувати Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Сформувати теги образу
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Зібрати образ
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Сканування образу (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Вхід у GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Опублікувати образ
        if: github.event_name != 'pull_request'
        run: docker push --all-tags ${{ env.IMAGE_NAME }}