---
- name: Налаштування сервера FinWise
  hosts: finwise
  become: true

  vars:
    docker_user: ubuntu
    app_dirs:
      - /opt/finwise
      - /opt/finwise/data
      - /opt/finwise/backups

  tasks:
    - name: Оновити кеш пакетів і встановити оновлення
      ansible.builtin.apt:
        update_cache: true
        upgrade: dist
        cache_valid_time: 3600

    - name: Встановити базові пакети
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - ufw
          - fail2ban
        state: present

    - name: Дозволити SSH, HTTP і HTTPS у фаєрволі
      community.general.ufw:
        rule: allow
        port: "{{ item }}"
        proto: tcp
      loop:
        - "22"
        - "80"
        - "443"

    - name: Увімкнути фаєрвол і заборонити решту вхідного трафіку
      community.general.ufw:
        state: enabled
        direction: incoming
        policy: deny

    - name: Запустити fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: started
        enabled: true

    - name: Створити каталог для ключів apt
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Додати GPG-ключ репозиторію Docker
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Додати репозиторій Docker
      ansible.builtin.apt_repository:
        repo: >-
          deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}
          signed-by=/etc/apt/keyrings/docker.asc]
          https://download.docker.com/linux/ubuntu
          {{ ansible_distribution_release }} stable
        filename: docker
        state: present

    - name: Встановити Docker Engine і плагін Compose
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Запустити Docker і додати його в автозапуск
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Додати робочого користувача в групу docker
      ansible.builtin.user:
        name: "{{ docker_user }}"
        groups: docker
        append: true

    - name: Створити каталоги застосунку
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ docker_user }}"
        group: "{{ docker_user }}"
        mode: "0755"
      loop: "{{ app_dirs }}"